name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Pinned image; the validator needs only the image's python3 (3.12, standard library).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate registries, schemas and test vectors
        run: python3 tools/validate.py
      - name: Self-test the validator against known-bad changes
        run: python3 tools/validate.py --self-test
